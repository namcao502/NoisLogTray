name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NoisLogTray.slnx

      - name: Build
        run: dotnet build NoisLogTray.slnx -c Release --no-restore

      # Tested code is pure helpers, so no Playwright browser install is needed.
      - name: Test
        run: dotnet test tests/NoisLogTray.Tests -c Release --no-build
