<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; }
  #terminal { position: absolute; inset: 6px 4px 4px 8px; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
  // Bridge to the host (WebView2): output arrives base64-encoded so multi-byte UTF-8 split across
  // reads stays intact; keystrokes and size changes go back as JSON messages.
  const params = new URLSearchParams(location.search);
  const term = new Terminal({
    fontFamily: "'Cascadia Mono', Consolas, monospace",
    fontSize: Number(params.get("fontSize") || 14),
    cursorBlink: true,
    scrollback: 5000,
    // claude picks its text colors for a dark background; this lifts any too faint for the theme (mostly light).
    minimumContrastRatio: 4.5,
    allowProposedApi: true,
    theme: { background: "#1e1e1e" },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("terminal"));

  const post = (message) => window.chrome.webview.postMessage(JSON.stringify(message));
  const sendSize = () => {
    fit.fit();
    post({ type: "resize", cols: term.cols, rows: term.rows });
  };

  // Ctrl+1..5 switch app pages (the host never sees keys typed in here).
  // Ctrl+C copies when text is selected; with no selection it still sends ^C to the CLI.
  term.attachCustomKeyEventHandler((event) => {
    if (event.ctrlKey && !event.shiftKey && !event.altKey && /^(Digit|Numpad)[1-5]$/.test(event.code)) {
      if (event.type === "keydown") post({ type: "page", index: Number(event.code.slice(-1)) });
      return false;
    }
    if (event.type === "keydown" && event.ctrlKey && !event.shiftKey && event.key === "c" && term.hasSelection()) {
      navigator.clipboard.writeText(term.getSelection());
      term.clearSelection();
      return false;
    }
    return true;
  });

  // A mouse selection (drag or double-click) is copied when the button is released; a right-click pastes.
  // On the document: a drag released past the terminal box still ends a selection.
  document.addEventListener("mouseup", () => {
    if (term.hasSelection()) navigator.clipboard.writeText(term.getSelection());
  });
  term.element.addEventListener("contextmenu", (event) => {
    event.preventDefault();
    post({ type: "pasteRequest" });
  });

  term.onData((data) => post({ type: "input", data }));
  window.addEventListener("resize", sendSize);

  window.chrome.webview.addEventListener("message", (event) => {
    const message = JSON.parse(event.data);
    if (message.type === "output") {
      const bytes = Uint8Array.from(atob(message.data), (ch) => ch.charCodeAt(0));
      term.write(bytes);
    } else if (message.type === "theme") {
      term.options.theme = message.theme;
      document.body.style.background = message.theme.background;
    } else if (message.type === "reset") {
      term.reset();
    } else if (message.type === "paste") {
      term.paste(message.text);
    } else if (message.type === "focus") {
      term.focus();
    } else if (message.type === "fit") {
      sendSize();
    }
  });

  sendSize();
  post({ type: "ready", cols: term.cols, rows: term.rows });
  term.focus();
</script>
</body>
</html>
